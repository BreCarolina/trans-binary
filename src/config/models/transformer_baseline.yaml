# Transformer baseline configuration for Fase-3
# 'n_features' and 'seq_len' can be set here, but they will be inferred automatically
# from the train_X file if present. Keep them as defaults or placeholders.

# active preset (optional): set to one of keys in feature_presets to override paths
preset: baseline_basic

# example of presets: map a preset name to the dataset paths to use
feature_presets:
  baseline_basic:
    train_X: data/processed/baseline_basic/EURJPY_M5_baseline_basic_X_train.npy
    train_y: data/processed/baseline_basic/EURJPY_M5_baseline_basic_y_train.npy
    val_X:   data/processed/baseline_basic/EURJPY_M5_baseline_basic_X_val.npy
    val_y:   data/processed/baseline_basic/EURJPY_M5_baseline_basic_y_val.npy

# Fallback/default values (will be overridden by inference)
seq_len: 60
n_features: 36

d_model: 128
n_heads: 4
num_layers: 4
dim_feedforward: 256
dropout: 0.1
pooling: "mean"
n_classes: 2

# Training params
batch_size: 64
epochs: 30
learning_rate: 5e-4
weight_decay: 1e-6
device: auto

# Scheduler
scheduler:
  type: ReduceLROnPlateau
  mode: min
  factor: 0.5
  patience: 3
  min_lr: 1e-7

# Paths (if not using presets, set these directly)
paths:
  # train_X: data/processed/baseline_basic/EURJPY_M5_baseline_basic_X_train.npy
  # train_y: data/processed/baseline_basic/EURJPY_M5_baseline_basic_y_train.npy
  # val_X:   data/processed/baseline_basic/EURJPY_M5_baseline_basic_X_val.npy
  # val_y:   data/processed/baseline_basic/EURJPY_M5_baseline_basic_y_val.npy
  checkpoints_dir: models/transformer/checkpoints
  log_json: logs/training/train_transformer_log.json

# Checkpointing
save_every_n_epochs: 1
max_checkpoints: 10

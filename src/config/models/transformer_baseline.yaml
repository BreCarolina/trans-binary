# Transformer baseline configuration for Fase-3
# Update n_features to match your processed data's column count

seq_len: 60                  # number of candles per sample (window size)
n_features: 36              # <-- UPDATE this to number of features produced by transformacao
d_model: 128
n_heads: 4
num_layers: 4
dim_feedforward: 256
dropout: 0.1
pooling: "mean"             # options: mean, max, cls
n_classes: 2

# Training params
batch_size: 64
epochs: 30
learning_rate: 5e-4
weight_decay: 1e-6
device: auto                 # "cpu", "cuda" or "auto" (auto uses cuda if available)

# Scheduler
scheduler:
  type: ReduceLROnPlateau
  mode: min
  factor: 0.5
  patience: 3
  min_lr: 1e-7

# Paths (relative to repo root)
paths:
  train_X: data/processed/baseline_basic/EURJPY_M5_baseline_basic_X_train.npy
  train_y: data/processed/baseline_basic/EURJPY_M5_baseline_basic_y_train.npy
  val_X:   data/processed/baseline_basic/EURJPY_M5_baseline_basic_X_val.npy
  val_y:   data/processed/baseline_basic/EURJPY_M5_baseline_basic_y_val.npy
  checkpoints_dir: models/transformer/checkpoints
  log_json: logs/training/train_transformer_log.json

# Checkpointing
save_every_n_epochs: 1
max_checkpoints: 10
